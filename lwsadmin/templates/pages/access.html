{% extends 'base.html' %}

{% block content %}

<form method="post">

    <input type="text" name="address" />
    <label for="view_key">Secret View Key</label>
    <input type="text" name="view_key" />
    <button type="submit">Register</button>
</form>
{% endblock %}
