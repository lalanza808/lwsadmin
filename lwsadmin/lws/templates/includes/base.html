<!DOCTYPE HTML>
<html>
	<head>
        <title>Community Monero LWS</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="shortcut icon" href="/static/images/favicon.ico" type="image/png">
        <meta itemprop="name" content="Community Monero LWS">
        <meta itemprop="description" content="Community Monero light-wallet server">
        <link rel="stylesheet" href="/static/chota.css">
        <link rel="stylesheet" href="/static/main.css">
        <link rel="stylesheet" href="/static/fa/all.min.css">
        <script src="/static/htmx.js"></script>
      </head>
      
	<body>
		<nav class="nav">
            <div class="nav-left">
              <a class="brand" href="/">Community LWS</a>
              <a class="{% if request.path == '/' %}active{% endif %}" href="/">Home</a>
              <a class="{% if request.path == '/register' %}active{% endif %}" href="/register">Register Wallet</a>
            </div>
            <div class="nav-right">
                {% if current_user.is_authenticated %}
                    <a class="{% if request.path == '/admin' %}active{% endif %}" href="/admin">Admin</a>
                    <a href="/logout">Logout</a>
                {% endif %}
            </div>
        </nav>
        <div class="container">
            <div style="margin: 1em;">
                {% for message in get_flashed_messages() %}
                    <li>{{ message }}</li>
                {% endfor %}
            </div>
		    {% block content %}
            {% endblock %}
        </div>
	</body>
</html>
